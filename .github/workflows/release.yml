name: Release draft

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.ref }}

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifacts/

      - name: Create Release draft
        working-directory: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict SHA256SUMS
          deb="rk628-media-initd_${GITHUB_REF_NAME#v}_all.deb"
          test -s "$deb"
          sha256sum "$deb" > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A Release already exists for $GITHUB_REF_NAME"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$deb" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes
